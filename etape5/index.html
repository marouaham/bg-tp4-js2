
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Etape 5 - Formulaire</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="table_container">

        <!-- Formulaire de saisie -->
        <div id="form_container">

            <h3>Ajouter une personne</h3>

            <div class="form_group">
                <label for="nom">Nom :</label>
                <input type="text" id="nom" placeholder="Saisir le nom">
            </div>

            <div class="form_group">
                <label for="prenom">Prénom :</label>
                <input type="text" id="prenom" placeholder="Saisir le prénom">
            </div>

            <div class="form_group">
                <label for="points">Points :</label>
                <input type="number" id="points" placeholder="Saisir les points">
            </div>

            <button type="button" onclick="doNewData()">Ajouter</button>

        </div>

        <!-- Tableau -->
        <table>
            <thead>
                <tr>
                    <th class="col_number">N°</th>
                    <th class="col_text">Nom</th>
                    <th class="col_text">Prénom</th>
                    <th class="col_number">Points</th>
                    <th class="col_chkbox">Select</th>
                </tr>
            </thead>

            <tbody id="table_body">
            </tbody>
        </table>

        <!-- Espace Résumé -->
        <div id="container_summary">
            <p id="p1">0 ligne(s)</p>
            <p id="p2"></p>
            <p id="p3">Totale point(s)= 0</p>
        </div>

        <button type="button" onclick="consoleTableau()">
            Console Tableau
        </button>

    </div>

    <script src="script.js"></script>
</body>
</html>
